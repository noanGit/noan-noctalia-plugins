id = "noan/lrcbar"
name = "Lyrics Bar (lrc_tty)"
version = "1.2.0"
plugin_api = 3
author = "noan"
license = "MIT"
icon = "music"
deprecated = false
description = "Karaoke-highlighted current lyric line in the bar via lrc_tty. Highlight-tracked scrolling, fade transitions, target a specific player."
tags = ["bar", "music", "lyrics"]
dependencies = ["lrc_tty", "playerctl"]

[[setting]]
key = "max_chars"
type = "int"
label_key = "settings.max_chars.label"
description_key = "settings.max_chars.description"
default = 50
min = 10
max = 80

[[setting]]
key = "fps_limit"
type = "int"
label_key = "settings.fps_limit.label"
description_key = "settings.fps_limit.description"
default = 60
min = 30
max = 120

[[setting]]
key = "active_color"
type = "string"
label_key = "settings.active_color.label"
description_key = "settings.active_color.description"
default = "primary"

[[setting]]
key = "inactive_color"
type = "string"
label_key = "settings.inactive_color.label"
description_key = "settings.inactive_color.description"
default = "on_surface_variant"

[[setting]]
key = "player"
type = "string"
label_key = "settings.player.label"
description_key = "settings.player.description"
default = ""

[[setting]]
key = "hide_when_paused"
type = "bool"
label_key = "settings.hide_when_paused.label"
description_key = "settings.hide_when_paused.description"
default = true

[[setting]]
key = "intro_gap_ms"
type = "int"
label_key = "settings.intro_gap_ms.label"
description_key = "settings.intro_gap_ms.description"
default = 6000
min = 0
max = 30000

[[setting]]
key = "interlude_text"
type = "string"
label_key = "settings.interlude_text.label"
description_key = "settings.interlude_text.description"
default = "♪ ♪ ♪"

[[widget]]
id = "lrcbar"
entry = "widget.luau"
